name: AgentGrid

options:
  bundleIdPrefix: com.thechosenvictor
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES

targets:
  AgentGrid:
    type: application
    platform: macOS
    sources:
      - path: Sources/AgentGrid
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thechosenvictor.AgentGrid
        PRODUCT_NAME: AgentGrid
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentGrid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Victor Solano"
        MARKETING_VERSION: 1.3.0
        CURRENT_PROJECT_VERSION: 4
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  AgentGridTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AgentGridTests
    dependencies:
      - target: AgentGrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thechosenvictor.AgentGridTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AgentGrid.app/Contents/MacOS/AgentGrid"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AgentGrid:
    build:
      targets:
        AgentGrid: all
        AgentGridTests: [test]
    test:
      targets:
        - name: AgentGridTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
