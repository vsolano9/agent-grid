name: AgentGrid

options:
  bundleIdPrefix: com.thechosenvictor
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"

packages:
  SwiftTerm:
    path: Vendor/SwiftTerm

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES

targets:
  TerminalViewMemoryStressFixture:
    type: tool
    platform: macOS
    sources:
      - path: Tests/Fixtures/TerminalViewMemoryStressFixture
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: TerminalViewMemoryStressFixture

  TerminalMemoryStressFixture:
    type: tool
    platform: macOS
    sources:
      - path: Tests/Fixtures/TerminalMemoryStressFixture
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: TerminalMemoryStressFixture

  FakeGrokACP:
    type: tool
    platform: macOS
    sources:
      - path: Tests/Fixtures/FakeGrokACP
    settings:
      base:
        PRODUCT_NAME: FakeGrokACP

  FocusStealFixture:
    type: application
    platform: macOS
    sources:
      - path: Tests/FocusStealFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thechosenvictor.AgentGridFocusStealFixture
        PRODUCT_NAME: FocusStealFixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentGrid Focus Steal Fixture
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

  AgentGrid:
    type: application
    platform: macOS
    configFiles:
      Release: Config/Release.xcconfig
    sources:
      - path: Sources/AgentGrid
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thechosenvictor.AgentGrid
        PRODUCT_NAME: AgentGrid
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentGrid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Victor Solano"
        MARKETING_VERSION: 1.4.0
        CURRENT_PROJECT_VERSION: 11
      configs:
        Release:
          DEVELOPMENT_TEAM: $(AGENTGRID_DEVELOPMENT_TEAM)
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: $(AGENTGRID_CODE_SIGN_IDENTITY)
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          AD_HOC_CODE_SIGNING_ALLOWED: $(AGENTGRID_AD_HOC_CODE_SIGNING_ALLOWED)
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  AgentGridTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AgentGridTests
      - path: Tests/FocusStealFixture/ProgrammaticFocusStealCoordinator.swift
    dependencies:
      - target: AgentGrid
      - target: FakeGrokACP
      - target: TerminalMemoryStressFixture
      - target: TerminalViewMemoryStressFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thechosenvictor.AgentGridTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AgentGrid.app/Contents/MacOS/AgentGrid"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TerminalMemoryStressFixture:
    build:
      targets:
        TerminalMemoryStressFixture: all
    run:
      config: Release

  TerminalViewMemoryStressFixture:
    build:
      targets:
        TerminalViewMemoryStressFixture: all
    run:
      config: Release

  AgentGrid:
    build:
      targets:
        FakeGrokACP: [test]
        AgentGrid: all
        AgentGridTests: [test]
    test:
      targets:
        - name: AgentGridTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release

  FocusStealFixture:
    build:
      targets:
        FocusStealFixture: all
    run:
      config: Debug
